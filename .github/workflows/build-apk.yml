name: Build Android APK

# Builds a real, installable release APK on GitHub's own runners (which
# have full internet access to pub.dev / Google's Maven repos — unlike
# the sandbox this code was written in). Push to `main` or trigger
# manually, then grab the APK from the run's "Artifacts" section.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/core_math_test.dart test/prayer_time_engine_test.dart

      - name: Decode signing keystore (only if secrets are configured)
        if: ${{ secrets.NOOR_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.NOOR_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "NOOR_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          echo "NOOR_KEYSTORE_PASSWORD=${{ secrets.NOOR_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "NOOR_KEY_ALIAS=${{ secrets.NOOR_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "NOOR_KEY_PASSWORD=${{ secrets.NOOR_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
