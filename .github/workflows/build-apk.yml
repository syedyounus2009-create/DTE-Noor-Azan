name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test test/core_math_test.dart test/prayer_time_engine_test.dart

      - name: Clean build
        run: flutter clean

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NOOR_KEYSTORE_BASE64 }}
        run: |
          printf "%s" "$KEYSTORE_BASE64" | base64 -d > android/app/noor-release.jks
          ls -lh android/app/noor-release.jks

      - name: Build APK
        env:
          NOOR_KEYSTORE_PATH: ${{ github.workspace }}/android/app/noor-release.jks
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.NOOR_KEYSTORE_PASSWORD }}
          NOOR_KEY_ALIAS: ${{ secrets.NOOR_KEY_ALIAS }}
          NOOR_KEY_PASSWORD: ${{ secrets.NOOR_KEY_PASSWORD }}
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/noor-release.jks
