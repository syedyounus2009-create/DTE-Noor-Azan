name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle  # ✅ Cache Gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true  # ✅ Cache Flutter SDK

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            $FLUTTER_HOME/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test test/core_math_test.dart test/prayer_time_engine_test.dart

      # ❌ REMOVE flutter clean - it wipes your cache!

      - name: Build APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
