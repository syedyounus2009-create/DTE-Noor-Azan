name: noor
description: "Noor — cross-platform Azan and prayer-times companion."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Location & sensors
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^6.0.1

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  workmanager: ^0.5.2

  # Audio
  audioplayers: ^6.0.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Networking (mosques + reverse geocoding)
  dio: ^5.5.0+1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/calculation_methods.json
    - assets/data/islamic_events.json
    - assets/data/cities_sample.json
    - assets/audio/
